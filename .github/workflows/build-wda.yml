name: Build WDA.ipa

on:
  workflow_dispatch:
    inputs:
      wda_version:
        description: 'WebDriverAgent version tag (e.g. v11.4.3)'
        required: true
        default: 'v11.4.3'
      add_adhoc_sign:
        description: 'Add ad-hoc signature (not needed for Sideloadly)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout WDA
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: ${{ github.event.inputs.wda_version }}

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Build for testing (unsigned)
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Find and list .app output
        run: |
          echo "=== Searching for .app in build output ==="
          find build/Build/Products -name "*.app" -type d 2>/dev/null || echo "No .app found in build/Build/Products"
          APP_PATH=$(find build/Build/Products -name "WebDriverAgentRunner-Runner.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: WebDriverAgentRunner-Runner.app not found!"
            ls -la build/Build/Products/ 2>/dev/null || echo "Products dir not found"
            exit 1
          fi

      - name: Create IPA (unsigned)
        if: github.event.inputs.add_adhoc_sign == 'false'
        run: |
          APP_PATH=$(find build/Build/Products -name "WebDriverAgentRunner-Runner.app" -type d | head -1)
          echo "Using app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r WebDriverAgent.ipa Payload/
          echo "=== IPA contents ==="
          unzip -l WebDriverAgent.ipa | head -30

      - name: Add ad-hoc signature to all binaries
        if: github.event.inputs.add_adhoc_sign == 'true'
        run: |
          APP_PATH=$(find build/Build/Products -name "WebDriverAgentRunner-Runner.app" -type d | head -1)
          echo "Using app at: $APP_PATH"
          
          # Find and sign all Mach-O binaries
          for binary in $(find "$APP_PATH" -type f -exec sh -c 'file "$1" | grep -q "Mach-O" && echo "$1"' _ {} \;); do
            echo "Signing: $binary"
            codesign --force --sign - --timestamp=none "$binary"
          done
          
          # Create IPA
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r WebDriverAgent.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-ipa-${{ github.event.inputs.wda_version }}
          path: WebDriverAgent.ipa